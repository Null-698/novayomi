name: Build IPA Unsigned

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-ipa-unsigned:
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build unsigned iOS IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr Novayomi-${{ github.ref_name }}-ios.ipa Payload

      - name: Upload artifact iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Novayomi-${{ github.ref_name }}-ios
          path: "build/ios/iphoneos/Novayomi-*.ipa"

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-ipa-unsigned
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Novayomi-*
          merge-multiple: true
          path: release-assets

      - name: Flatten release assets
        run: |
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          generateReleaseNotes: true
          allowUpdates: true
