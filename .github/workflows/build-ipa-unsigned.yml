name: Build IPA Unsigned

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing tag for publishing a GitHub Release'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-ipa-unsigned:
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: arm64
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          prefix-key: "v1-novayomi-rust"
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Check native reader Dart types
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/modules/novel/native_novel_reader_screen.dart \
            lib/modules/novel/novel_reader_view.dart \
            lib/modules/library/native_ios_novel_library.dart \
            lib/modules/library/widgets/library_dialogs.dart \
            lib/router/router.dart

      - name: Check native iOS Swift syntax
        run: |
          xcrun swiftc -frontend -parse ios/Runner/NovayomiNativeReader.swift
          xcrun swiftc -frontend -parse ios/Runner/NovayomiNativeLibrary.swift

      - name: Build unsigned iOS IPA
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          # Flutter can misleadingly print provisioning instructions for any
          # unclassified Xcode build failure; save verbose diagnostics instead.
          set +e
          flutter build ios --release --no-codesign --verbose \
            2>&1 \
            | tee "$RUNNER_TEMP/novayomi-ios-build.log" \
            | grep --line-buffered -Ei 'error:|error \(|warning:|Swift Compiler Error|failed to|BUILD FAILED|Xcode build|Running pod install|Building for device|✓ Built|fatal error|Provisioning|signing'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Last 180 lines of verbose Xcode/Flutter build"
            tail -n 180 "$RUNNER_TEMP/novayomi-ios-build.log"
            echo "::endgroup::"
            echo "::error::Unsigned iOS build failed. Download the build-diagnostics artifact to inspect the full Xcode output."
            exit "$status"
          fi
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr Novayomi-${{ inputs.release_tag || github.ref_name }}-ios.ipa Payload

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novayomi-ios-build-diagnostics
          path: ${{ runner.temp }}/novayomi-ios-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Novayomi-${{ inputs.release_tag || github.ref_name }}-ios
          path: "build/ios/iphoneos/Novayomi-*.ipa"

  publish-release:
    if: ${{ inputs.release_tag != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-ipa-unsigned
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Novayomi-*
          merge-multiple: true
          path: release-assets

      - name: Flatten release assets
        run: |
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          generateReleaseNotes: true
          allowUpdates: true
          tag: ${{ inputs.release_tag }}
