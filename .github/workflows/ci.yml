name: CI

# Analyze and test shared code; build iOS in debug mode.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated files (frb_generated.dart, *.g.dart, l10n) are committed, so
      # analyze runs without the Rust/codegen toolchain. Fail only on errors
      # (e.g. undefined symbols / type errors), not pre-existing infos/warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Repository tests open a real Isar database and download its native
      # core on first use; the C++ image decoder is built by hook/build.dart
      # with the runner's clang. Neither needs the Rust toolchain.
      - name: Run tests
        run: flutter test

  shiori:
    name: Shiori design system
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The package is analysed and tested on its own, so a component can't
      # quietly start depending on the app.
      - name: Analyze and test the package
        working-directory: packages/shiori
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Every use case in the catalogue is opened once, and the web build
      # proves it still compiles for the browser.
      - name: Analyze, test and build the catalogue
        working-directory: widgetbook
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web

  build-ios:
    name: Build (iOS debug)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug iOS
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: Novayomi-ios-debug
          path: build/ios/iphoneos/Runner.app
