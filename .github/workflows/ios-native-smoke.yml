name: Native iOS UI smoke test

on:
  push:
    branches: [main]
    paths:
      - 'lib/**/*.dart'
      - 'ios/Runner/**/*.swift'
      - 'ios/Runner.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-native-smoke.yml'
  workflow_dispatch:

jobs:
  native-ui-types:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze iOS native-platform bridges
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/modules/novel/native_novel_reader_screen.dart \
            lib/modules/main_view/widgets/mobile_bottom_navigation.dart \
            lib/modules/main_view/main_screen.dart \
            lib/modules/library/native_ios_novel_library.dart \
            lib/modules/manga/detail/native_ios_novel_detail.dart \
            lib/modules/more/native_ios_more_screen.dart \
            lib/modules/browse/native_ios_browse_screen.dart \
            lib/modules/history/native_ios_activity_screen.dart \
            lib/modules/more/download_queue/native_ios_download_queue.dart \
            lib/modules/more/settings/native_ios_settings_screen.dart \
            lib/modules/more/settings/native_ios_preferences_screen.dart \
            lib/modules/more/settings/native_ios_service_settings.dart \
            lib/modules/more/settings/browse/native_ios_source_repositories.dart \
            lib/modules/more/settings/track/manage_trackers/native_ios_manage_trackers.dart \
            lib/modules/more/data_and_storage/native_ios_data_storage.dart \
            lib/modules/manga/home/native_ios_source_results.dart \
            lib/modules/browse/global_search/native_ios_global_search.dart \
            lib/modules/browse/extension/native_ios_extension_detail.dart \
            lib/modules/browse/sources/native_ios_source_filter.dart \
            lib/router/router.dart
      - name: Parse all native Swift views
        run: |
          for file in ios/Runner/NovayomiNative*.swift; do
            swiftc -frontend -parse "$file"
          done
          swiftc -frontend -parse ios/Runner/NovayomiPosterGrid.swift
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD
      - name: Verify default routes and platform-view registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          router = Path('lib/router/router.dart').read_text()
          app = Path('ios/Runner/AppDelegate.swift').read_text()
          project = Path('ios/Runner.xcodeproj/project.pbxproj').read_text()
          assert 'NATIVE_LIBRARY_PREVIEW' not in router
          for name in [
              'NativeIosNovelLibrary', 'NativeIosNovelDetail',
              'NativeIosBrowseScreen', 'NativeIosActivityScreen',
              'NativeIosMoreScreen', 'NativeIosSettingsScreen',
              'NativeIosPreferencesScreen', 'NativeIosServiceSettings',
              'NativeIosGlobalSearch', 'NativeIosDataStorage',
              'NativeIosExtensionDetail', 'NativeIosSourceFilter',
          ]:
              assert name in router, f"Unwired route: {name}"
          for suffix in [
              'native-library', 'native-novel-detail', 'native-more',
              'native-browse', 'native-activity', 'native-downloads',
              'native-settings', 'native-preferences', 'native-source-results',
          ]:
              assert f'withId: "novayomi/{suffix}"' in app, suffix
          for path in Path('ios/Runner').glob('NovayomiNative*.swift'):
              assert f'{path.name} in Sources' in project, path.name
          # Guard the nonblocking reader transition and native presentation.
          reader = Path('lib/modules/novel/native_novel_reader_screen.dart').read_text()
          swift_reader = Path('ios/Runner/NovayomiNativeReader.swift').read_text()
          details = Path('ios/Runner/NovayomiNativeNovelDetail.swift').read_text()
          close = reader.split('void _closeFromNative()', 1)[1].split('  @override', 1)[0]
          assert 'Navigator.of(context).pop()' in close
          assert 'await _persistChapter()' not in close
          assert 'await WidgetsBinding.instance.endOfFrame' not in close
          assert 'setHistoryUpdate(elapsedSeconds: elapsed).catchError' in close
          assert 'finishClose' in close
          assert 'onEvent?(["type":"closeRequested"])' in swift_reader
          assert 'chapterHeader' in details and 'configureChapterHeader' in details
          assert 'NovayomiPosterGrid.swift in Sources' in project
          library = Path('ios/Runner/NovayomiNativeLibrary.swift').read_text()
          browse = Path('ios/Runner/NovayomiNativeBrowse.swift').read_text()
          settings = Path('ios/Runner/NovayomiNativeSettings.swift').read_text()
          preferences = Path('ios/Runner/NovayomiNativePreferences.swift').read_text()
          # Full-bleed novel covers, dynamic title, and scrolling search.
          assert 'coverGradient' in library and 'coverCaption' in library
          assert 'libraryHeaderHeight' in library and 'compactTitle.alpha' in library
          assert 'libraryTitleHeader.superview !== header' in library
          assert 'NovayomiSourceRowCell' in browse and 'loadIcon(imageURL)' in browse
          assert 'titleHeader' in settings and 'scrollViewDidScroll' in settings
          assert 'largeTitle.text = sectionTitle' in preferences
          bars = Path('ios/Runner/NovayomiNativeBars.swift').read_text()
          nav = Path('lib/modules/main_view/widgets/mobile_bottom_navigation.dart').read_text()
          source = Path('ios/Runner/NovayomiNativeSourceResults.swift').read_text()
          source_dart = Path('lib/modules/manga/home/native_ios_source_results.dart').read_text()
          more = Path('ios/Runner/NovayomiNativeMore.swift').read_text()
          assert 'tabSearch' in bars and 'searchPressed' in bars
          assert "route.push('/globalSearch'" in nav
          assert "ItemType.novel" in nav and "Settings" in nav
          assert 'configureHomeHeader' in source and 'NovayomiFeaturedNovelCell' in source
          assert 'getPopularProvider' in source_dart and 'getLatestUpdatesProvider' in source_dart
          assert 'heading.text = "Settings"' in more and 'tile(for: item)' in more
          # Reference screens: Browse actions above the title, full-scroll
          # Settings, search with real filter chips, and no dangling hit areas.
          assert 'heading.topAnchor.constraint(equalTo: addButton.bottomAnchor' in browse
          assert 'table.contentInset.bottom = 108' in browse
          assert 'table.contentInset.bottom = 114' in more
          assert 'item.path == "incognito" ? nil : tile(for: item)' in more
          assert 'filterStack.addArrangedSubview(status)' in source
          assert 'filterStack.addArrangedSubview(genre)' in source
          assert 'visibleIndices[index]' in source
          assert 'pendingSearch?.cancel()' in source
          assert 'filterHeight.constant = homeMode ? 0 : 50' in source
          global_dart = Path('lib/modules/browse/global_search/native_ios_global_search.dart').read_text()
          assert "'status': novel.status?.name" in global_dart
          assert "'genres': novel.genre" in global_dart
          assert "'chapter': novel.chapters?.firstOrNull?.name" in source_dart
          print('Native reader, library, Browse, Settings, tab search, and source Home verified.')
          PY
